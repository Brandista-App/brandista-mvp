groups:
  - name: brandista-production
    rules:
      - alert: BrandistaScrapeUnavailable
        expr: up{job="brandista"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: 'Private backend metrics unavailable; check readiness before restart'}
      - alert: BrandistaServerErrors
        expr: sum(rate(http_server_requests_seconds_count{job="brandista",status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job="brandista"}[5m])), 0.01) > 0.01
        for: 5m
        labels: {severity: critical}
        annotations: {summary: 'Backend 5xx rate above 1%; inspect route and dependency saturation'}
      - alert: BrandistaLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="brandista"}[5m]))) > 1
        for: 10m
        labels: {severity: warning}
        annotations: {summary: 'Backend p95 above one second; compare pool waits, CPU and database locks'}
      - alert: BrandistaDatabasePoolWait
        expr: hikaricp_connections_pending{job="brandista"} > 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: 'Requests are waiting for database connections; do not raise pools blindly'}
