name: Backend tests
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.gitattributes'
      - 'docker/**'
      - 'scripts/test-render-ca.py'
      - 'scripts/test-deployment-runtime.py'
      - 'scripts/verify-admin-*-mysql.ps1'
      - 'scripts/production-owner.ps1'
      - 'scripts/test-production-owner.ps1'
      - 'scripts/test-production-owner-exit.ps1'
      - 'scripts/test-owner-packaged.py'
      - 'docs/deployment/**'
      - 'src/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw*'
      - 'scripts/load/**'
      - 'deploy/production-like/**'
      - 'docs/production/**'
      - 'docs/performance/**'
      - '.github/workflows/backend-tests.yml'
permissions:
  contents: read
jobs:
  owner-packaged-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        console: [powershell, pwsh]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the actual operator JAR and isolated fixture classes
        shell: pwsh
        run: ./mvnw.cmd --batch-mode --no-transfer-progress verify
      - name: Prepare pinned native MySQL and real Windows terminal test dependencies
        shell: pwsh
        run: |
          python -m pip install pywinpty==3.1.0 cryptography==46.0.3
          if ($LASTEXITCODE -ne 0) { throw 'Terminal test dependencies failed' }
          Invoke-WebRequest 'https://cdn.mysql.com/Downloads/MySQL-8.4/mysql-8.4.11-winx64.zip' -OutFile target/mysql-owner.zip
          if ((Get-FileHash target/mysql-owner.zip -Algorithm SHA256).Hash -ne 'A492371D687D2BAB088B0062581144A0044B8964BAEFDF4FAA579292B423D25C') { throw 'MySQL archive integrity check failed' }
          Expand-Archive target/mysql-owner.zip target/mysql-owner
      - name: Exercise real console, packaged JAR, masked input and TLS MySQL
        shell: pwsh
        run: python scripts/test-owner-packaged.py --mysql-bin target/mysql-owner/mysql-8.4.11-winx64/bin --shell ${{ matrix.console }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: owner-packaged-${{ matrix.console }}-results
          path: target/owner-packaged-evidence/results.json
          if-no-files-found: warn
          retention-days: 14

  owner-wrapper:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify operator wrapper contracts without database access
        shell: pwsh
        run: ./scripts/test-production-owner.ps1
      - name: Verify PowerShell runner exit and failure propagation
        shell: pwsh
        run: ./scripts/test-production-owner-exit.ps1

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Full backend verification
        run: sh ./mvnw --batch-mode --no-transfer-progress verify
      - name: Check load generator syntax (load is opt-in and isolated)
        run: node --check scripts/load/mixed-load.mjs

  docker-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Build the real non-root Docker image
        run: docker build --progress=plain -t brandista-render-ca:test .
      - name: Verify runtime CA trust, preserved public CAs and fail-closed setup
        run: python3 scripts/test-render-ca.py
      - name: Verify production image with TLS MySQL and 512 MiB limit
        run: python3 scripts/test-deployment-runtime.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deployment-runtime-evidence
          path: target/deployment-runtime/evidence/
          if-no-files-found: warn
          retention-days: 14

  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [pr2, pr3, pr4, pr6b, pr7a]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Disposable MySQL migration and API integration
        shell: pwsh
        run: ./scripts/verify-admin-${{ matrix.suite }}-mysql.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mysql-${{ matrix.suite }}-evidence
          path: |
            target/admin-*-mysql.log
            target/surefire-reports/TEST-*.xml
          if-no-files-found: warn
          retention-days: 14
