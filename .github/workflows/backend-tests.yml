name: Backend tests
on:
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw*'
      - 'scripts/load/**'
      - 'deploy/production-like/**'
      - 'docs/production/**'
      - '.github/workflows/backend-tests.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Full backend verification
        run: sh ./mvnw --batch-mode --no-transfer-progress verify
      - name: Check load generator syntax (load is opt-in and isolated)
        run: node --check scripts/load/mixed-load.mjs
