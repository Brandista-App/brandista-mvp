name: Investigate health contract at 773623a
on:
  push:
    branches: [codex/health-investigation-773623a]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: sh ./mvnw --batch-mode --no-transfer-progress -Dtest=HealthContractIntegrationTests test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: health-contract-results
          path: target/surefire-reports/
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        cpu: ['0.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 773623a9ddea2211be5088a5ce5e3667f286b261
          path: production-source
      - name: Build the exact deployed source revision
        run: |
          test "$(git -C production-source rev-parse HEAD)" = 773623a9ddea2211be5088a5ce5e3667f286b261
          docker build --progress=plain -t brandista-render-ca:test production-source
      - name: Exercise default JDBC TLS configuration and health failure modes
        env:
          HEALTH_INVESTIGATION: 'true'
          RUNTIME_CPU_LIMIT: ${{ matrix.cpu }}
          CONTROLLED_015: 'true'
        run: python3 scripts/test-deployment-runtime.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: health-image-cpu-${{ matrix.cpu }}
          path: target/deployment-runtime/evidence/
          retention-days: 14
