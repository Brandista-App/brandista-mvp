spring:
  application:
    name: brandista
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

brandista:
  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64:}
      issuer: ${JWT_ISSUER:brandista}
      audience: ${JWT_AUDIENCE:brandista-api}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
