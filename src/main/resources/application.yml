spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: brandista
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

brandista:
  invitations:
    auto-on-approval: ${MERCHANT_AUTO_INVITE_ON_APPROVAL:true}
    email-enabled: ${MERCHANT_EMAIL_ENABLED:false}
    token-key-base64: ${MERCHANT_INVITATION_TOKEN_KEY_BASE64:}
    resend-api-key: ${RESEND_API_KEY:}
    resend-domain-id: ${RESEND_DOMAIN_ID:}
    sender-email: ${MERCHANT_SENDER_EMAIL:}
    registration-origin: ${MERCHANT_REGISTRATION_ORIGIN:}
  checkout:
    cod-enabled: ${COD_CHECKOUT_ENABLED:false}
  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64:}
      issuer: ${JWT_ISSUER:brandista}
      audience: ${JWT_AUDIENCE:brandista-api}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
